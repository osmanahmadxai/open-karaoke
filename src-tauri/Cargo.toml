[package]
name = "open-karaoke"
version = "0.1.0"
description = "Open Karaoke — open-source karaoke studio with real-time autotune"
authors = ["Open Karaoke contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.80"

[lib]
name = "open_karaoke_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "rt", "macros", "fs", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

# audio
cpal = "0.18"
symphonia = { version = "0.5", default-features = false, features = ["aac", "isomp4", "mp3", "wav", "flac", "ogg", "vorbis", "mkv"] }
rubato = "0.16"
realfft = "3"
ringbuf = "0.4"
crossbeam-channel = "0.5"
hound = "3"
signalsmith-stretch = "0.1"

[profile.dev]
# DSP code is far too slow unoptimised; keep debug builds usable for singing.
opt-level = 2

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
